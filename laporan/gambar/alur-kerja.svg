<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1334" viewBox="0 0 860 1334"><defs><marker id="ujung" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475B"/></marker></defs><rect width="860" height="1334" fill="#FFFFFF"/><rect x="30" y="196" width="800" height="1120" rx="12" fill="none" stroke="#054376" stroke-width="1.4" stroke-dasharray="8 6"/><text x="48" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#054376">PUTARAN UTAMA (loop), DIULANG TANPA HENTI</text><rect x="205" y="18" width="160" height="40" rx="20" fill="#054376" stroke="#054376" stroke-width="1.4"/><text x="285" y="38" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">MULAI</text><path d="M285,58 L285,90" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><rect x="99" y="102" width="372" height="64" rx="6" fill="#EAF1F8" stroke="#054376" stroke-width="1.4"/><text x="285" y="124.25" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B2540">Inisialisasi (setup): relay mati,</text><text x="285" y="143.75" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B2540">servo 0°, RTC diperiksa, WiFi tersambung</text><path d="M285,166 L285,250" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><rect x="99" y="250" width="372" height="62" rx="6" fill="#EAF1F8" stroke="#054376" stroke-width="1.4"/><text x="285" y="271.25" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B2540">Jaga WiFi, baca sensor level air</text><text x="285" y="290.75" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B2540">(10 sampel ADC dirata-ratakan → level %)</text><path d="M285,312 L285,344" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><polygon points="285,344 471,386 285,428 99,386" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.4"/><text x="285" y="376.9" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">Pompa menyala dan</text><text x="285" y="395.09999999999997" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">level ≥ 95% ?</text><text x="483" y="377" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Ya</text><path d="M471,386 L592,386" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><rect x="592" y="357" width="226" height="58" rx="6" fill="#FDECEC" stroke="#B42318" stroke-width="1.4"/><text x="705" y="376.9" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#521010">Matikan pompa, catat</text><text x="705" y="395.09999999999997" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#521010">event critical_water</text><path d="M705,415 L705,444 L291,444" fill="none" stroke="#33475B" stroke-width="1.5"/><text x="297" y="447" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Tidak</text><path d="M285,428 L285,460" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><polygon points="285,460 471,518 285,576 99,518" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.4"/><text x="285" y="499.8" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">Level &lt; ambang, tidak terkunci,</text><text x="285" y="518" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">3 bacaan rendah berturut-turut,</text><text x="285" y="536.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">dan jeda ≥ 30 detik lewat ?</text><text x="483" y="509" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Ya</text><path d="M471,518 L592,518" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><rect x="592" y="489" width="226" height="58" rx="6" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/><text x="705" y="508.9" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0F3A22">Nyalakan pompa</text><text x="705" y="527.1" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0F3A22">(relay aktif rendah)</text><path d="M705,547 L705,592 L291,592" fill="none" stroke="#33475B" stroke-width="1.5"/><text x="297" y="595" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Tidak</text><path d="M285,576 L285,608" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><polygon points="285,608 471,666 285,724 99,666" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.4"/><text x="285" y="647.8" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">Pompa nyala dan level ≥ target</text><text x="285" y="666" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">isi 3 kali berturut-turut atau</text><text x="285" y="684.1999999999999" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">durasi maksimum habis ?</text><text x="483" y="657" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Ya</text><path d="M471,666 L592,666" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><rect x="592" y="627" width="226" height="78" rx="6" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/><text x="705" y="647.8" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0F3A22">Matikan pompa. Bila air masih</text><text x="705" y="666" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0F3A22">di bawah ambang setelah durasi</text><text x="705" y="684.1999999999999" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0F3A22">habis, kunci pompa</text><path d="M705,705 L705,740 L291,740" fill="none" stroke="#33475B" stroke-width="1.5"/><text x="297" y="743" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Tidak</text><path d="M285,724 L285,756" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><rect x="99" y="756" width="372" height="80" rx="6" fill="#EAF1F8" stroke="#054376" stroke-width="1.4"/><text x="285" y="776.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B2540">Baca sensor pakan: 5 ping → median</text><text x="285" y="796" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B2540">→ perataan → stok % (ditunda saat</text><text x="285" y="815.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#0B2540">servo atau pompa aktif)</text><path d="M285,836 L285,868" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><polygon points="285,868 471,906 285,944 99,906" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.4"/><text x="285" y="906" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">Stok pakan &lt; ambang ?</text><text x="483" y="897" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Ya</text><path d="M471,906 L592,906" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><rect x="592" y="877" width="226" height="58" rx="6" fill="#FDECEC" stroke="#B42318" stroke-width="1.4"/><text x="705" y="896.9" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#521010">Catat event critical_food</text><text x="705" y="915.1" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#521010">(sekali, histeresis 8%)</text><path d="M705,935 L705,960 L291,960" fill="none" stroke="#33475B" stroke-width="1.5"/><text x="297" y="963" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Tidak</text><path d="M285,944 L285,976" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><polygon points="285,976 471,1018 285,1060 99,1018" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.4"/><text x="285" y="1008.9" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">Jam RTC sama dengan</text><text x="285" y="1027.1" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">jadwal pagi atau sore ?</text><text x="483" y="1009" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Ya</text><path d="M471,1018 L592,1018" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><rect x="592" y="979" width="226" height="78" rx="6" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/><text x="705" y="999.8" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0F3A22">Servo ke 90° selama durasi</text><text x="705" y="1018" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0F3A22">pakan, lalu kembali ke 0°;</text><text x="705" y="1036.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0F3A22">catat event feed_done</text><path d="M705,1057 L705,1076 L291,1076" fill="none" stroke="#33475B" stroke-width="1.5"/><text x="297" y="1079" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Tidak</text><path d="M285,1060 L285,1092" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><polygon points="285,1092 471,1130 285,1168 99,1130" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.4"/><text x="285" y="1130" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D2A06">≥ 5 detik sejak laporan terakhir ?</text><text x="483" y="1121" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Ya</text><path d="M471,1130 L592,1130" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><rect x="592" y="1091" width="226" height="78" rx="6" fill="#EAF1F8" stroke="#054376" stroke-width="1.4"/><text x="705" y="1111.8" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0B2540">POST telemetri ke Worker</text><text x="705" y="1130" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0B2540">(pembacaan, event, ack)</text><text x="705" y="1148.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0B2540">lewat HTTPS</text><path d="M705,1169 L705,1208" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><rect x="577" y="1208" width="256" height="84" rx="6" fill="#EAF1F8" stroke="#054376" stroke-width="1.4"/><text x="705" y="1231.8" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0B2540">Terima balasan 200: selaraskan</text><text x="705" y="1250" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0B2540">RTC, terapkan setelan dan</text><text x="705" y="1268.2" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#0B2540">kalibrasi, jalankan perintah</text><path d="M577,1250 L66,1250 L66,281" fill="none" stroke="#33475B" stroke-width="1.5"/><path d="M66,281 L99,281" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><path d="M99,1130 L66,1130" fill="none" stroke="#33475B" stroke-width="1.5"/><text x="91" y="1121" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#33475B">Tidak</text></svg>