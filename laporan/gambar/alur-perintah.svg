<svg xmlns="http://www.w3.org/2000/svg" width="800" height="786" viewBox="0 0 800 786"><defs><marker id="ujung" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475B"/></marker></defs><rect width="800" height="786" fill="#FFFFFF"/><rect x="9" y="26" width="218" height="56" rx="6" fill="#EAF1F8" stroke="#054376" stroke-width="1.4"/><text x="118" y="44.575" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#0B2540">Pengguna</text><text x="118" y="63.425000000000004" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#0B2540">Dashboard atau Telegram</text><path d="M118,82 L118,760" stroke="#8AA0B5" stroke-width="1.4" stroke-dasharray="6 6" fill="none"/><rect x="291" y="26" width="218" height="56" rx="6" fill="#EAF1F8" stroke="#054376" stroke-width="1.4"/><text x="400" y="44.575" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#0B2540">Cloudflare Worker</text><text x="400" y="63.425000000000004" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#0B2540">dan basis data D1</text><path d="M400,82 L400,760" stroke="#8AA0B5" stroke-width="1.4" stroke-dasharray="6 6" fill="none"/><rect x="573" y="26" width="218" height="56" rx="6" fill="#EAF1F8" stroke="#054376" stroke-width="1.4"/><text x="682" y="44.575" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#0B2540">NodeMCU ESP8266</text><text x="682" y="63.425000000000004" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#0B2540">di akuarium</text><path d="M682,82 L682,760" stroke="#8AA0B5" stroke-width="1.4" stroke-dasharray="6 6" fill="none"/><path d="M118,150 L398,150" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><text x="259" y="137" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0B2540">1. POST /api/command {type: feed}</text><rect x="235" y="192" width="330" height="60" rx="6" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.4"/><text x="400" y="213.225" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#3D2A06">2. Perintah disimpan di tabel commands</text><text x="400" y="230.775" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#3D2A06">(acked_at masih kosong)</text><path d="M682,310 L402,310" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><text x="541" y="297" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0B2540">3. POST /api/telemetry</text><text x="541" y="326" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33475B">pembacaan, event, ack (selang 5 detik)</text><path d="M400,388 L680,388" fill="none" stroke="#33475B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ujung)"/><text x="541" y="375" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0B2540">4. Balasan 200</text><text x="541" y="404" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33475B">commands, settings, epoch_wib</text><rect x="547" y="433" width="270" height="78" rx="6" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/><text x="682" y="454.45" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#0F3A22">5. Servo terbuka selama durasi</text><text x="682" y="472" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#0F3A22">pakan, lalu menutup; event</text><text x="682" y="489.55" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#0F3A22">feed_done dicatat</text><path d="M682,566 L402,566" fill="none" stroke="#33475B" stroke-width="1.5"  marker-end="url(#ujung)"/><text x="541" y="553" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0B2540">6. POST /api/telemetry berikutnya</text><text x="541" y="582" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33475B">ack berisi id perintah, event feed_done</text><rect x="235" y="624" width="330" height="60" rx="6" fill="#FFF4D6" stroke="#B7791F" stroke-width="1.4"/><text x="400" y="645.225" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#3D2A06">7. acked_at diisi; event baru diteruskan</text><text x="400" y="662.775" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#3D2A06">ke Telegram oleh Worker</text><path d="M400,732 L120,732" fill="none" stroke="#33475B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ujung)"/><text x="259" y="719" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0B2540">8. Dashboard menarik /api/latest</text><text x="259" y="748" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#33475B">perintah tampil terkonfirmasi</text></svg>